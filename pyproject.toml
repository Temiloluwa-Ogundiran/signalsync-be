[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[project]
name = "synctrades-be"
version = "0.1.0"
description = "SyncTrades backend API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.4",
    "bcrypt>=4.1",
    "celery[redis]>=5.5.3",
    "cryptography>=45.0.7",
    "fastapi[standard]>=0.135.1",
    "gunicorn>=23.0.0",
    "httpx>=0.27.0",
    "pyjwt>=2.9",
    "slowapi>=0.1.9",
    "psycopg2-binary>=2.9.11",
    "pydantic-settings>=2.13.1",
    "pydantic[email]>=2.12.5",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.22",
    "openpyxl>=3.1.2",
    "sqlalchemy>=2.0.48",
    "boto3>=1.35.0",
    "tzdata>=2025.2",
    "uvicorn[standard]>=0.41.0",
    # AI copilot (Partna AI)
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary,pool]>=3.1.0",
    "redis>=5.0.0",
    "telethon>=1.40.0",
    "qrcode[pil]>=8.2",
    "anyio>=4.0.0",
    "metaapi-cloud-sdk==29.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "pytest-httpx>=0.35.0",
]
