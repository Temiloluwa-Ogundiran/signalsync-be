[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[project]
name = "synctrades-be"
version = "0.1.0"
description = "SyncTrades backend API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.4",
    "bcrypt==4.0.1",
    "celery[redis]>=5.5.3",
    "cryptography>=45.0.7",
    "fastapi[standard]>=0.135.1",
    "httpx>=0.27.0",
    "passlib[bcrypt]>=1.7.4",
    "psycopg2-binary>=2.9.11",
    "pydantic-settings>=2.13.1",
    "pydantic[email]>=2.12.5",
    "python-dotenv>=1.2.2",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.22",
    "openpyxl>=3.1.2",
    "sqlalchemy>=2.0.48",
    "supabase>=2.28.0",
    "tzdata>=2025.2",
    "uvicorn[standard]>=0.41.0",
]
